<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKEDEX</title>
    <link rel="icon" href="./icons/favicon.png" type="image/x-icon">
     <link rel="stylesheet" href="styles.css">
    <script src="template.js"></script>
    <script src="db.js"></script>
    <script src="scripts.js"></script>
   

</head>
<body onload="onloadFunc()">
    <header>
         <h1>POKEDEX</h1>
        <input type="text" id="search-input" placeholder="Pokémon suchen..." oninput="filterandShowNames(this.value)">
    </header>

    <div class="card-container"></div>

    <div class="load-more-container">
        <button id="load-more-btn" onclick="loadMorePokemon()">Mehr laden</button>
        <div id="load-more-loading" class="loading-spinner" hidden></div>
    </div>

    <div id="pokemon-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-nav modal-nav-prev" aria-label="Vorheriges Pokémon">&#10094;</button>
            <button class="modal-nav modal-nav-next" aria-label="Nächstes Pokémon">&#10095;</button>
            <button class="modal-close" aria-label="Schließen">&times;</button>
            <div class="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 POKEDEX. All rights reserved.</p>
    </footer>
</body>
</html>
